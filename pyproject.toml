[project]
name = "bankrag"
version = "0.1.0"
description = "Question answering over Danish bank annual reports, with page citations and evals"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anders Henriksen", email = "anhenr.dev@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "bm25s>=0.2",
    "pymupdf>=1.26",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
bankrag = "bankrag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankrag"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # word lists read better as one string split on spaces

[tool.pytest.ini_options]
testpaths = ["tests"]
