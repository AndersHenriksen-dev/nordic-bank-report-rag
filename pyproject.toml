[project]
name = "bankrag"
version = "0.1.0"
description = "Question answering over Danish bank annual reports, with page citations and evals"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anders Henriksen", email = "anhenr.dev@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "bm25s>=0.2",
    "pydantic>=2.5",
    "pymupdf>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
bankrag = "bankrag.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankrag"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# E/F/I/W: pyflakes/pycodestyle/import-order baseline.
# ANN: every function has input/output type annotations (mypy checks they're correct).
# D: Google-convention docstrings on modules, classes and functions (see .claude/reference/python-style.md).
# B/SIM/C4/UP: bugbear, simplify, comprehensions, pyupgrade; catches non-idiomatic/needlessly complex code.
# COM812: trailing comma required on multi-line calls/literals, so exploded arguments stay consistent.
# RUF: ruff's own additional checks.
select = ["E", "F", "I", "W", "ANN", "D", "B", "SIM", "C4", "UP", "COM812", "RUF"]
# SIM905: stopword lists read better as one string split on spaces than as 60 quoted items.
ignore = ["SIM905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names/classes already say what they cover; module docstrings are still required.
"tests/**" = ["D101", "D102", "D103"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

# Third-party deps without type information: exempt per module, not globally, so a new untyped dependency needs its
# own entry here.
[[tool.mypy.overrides]]
module = ["bm25s", "bm25s.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
